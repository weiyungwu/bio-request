<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <!-- Metabolism: one large molecule <-> several small ones. No text: meaning is carried by the caption. -->
  <rect width="320" height="240" fill="#0b1b3a"/>
  <g transform="translate(95,120)">
    <circle cx="0" cy="0" r="10" fill="#2dd4bf"/>
    <circle cx="20" cy="-15" r="10" fill="#2dd4bf"/>
    <circle cx="20" cy="15" r="10" fill="#2dd4bf"/>
    <circle cx="-20" cy="0" r="10" fill="#2dd4bf"/>
    <line x1="0" y1="0" x2="20" y2="-15" stroke="#0b1b3a" stroke-width="3"/>
    <line x1="0" y1="0" x2="20" y2="15" stroke="#0b1b3a" stroke-width="3"/>
    <line x1="0" y1="0" x2="-20" y2="0" stroke="#0b1b3a" stroke-width="3"/>
  </g>
  <path d="M150 105 L185 105" stroke="#a3e635" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M185 140 L150 140" stroke="#facc15" stroke-width="3" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a3e635"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#facc15"/></marker>
  </defs>
  <g transform="translate(230,122)">
    <circle cx="-15" cy="-15" r="8" fill="#facc15"/>
    <circle cx="15" cy="-15" r="8" fill="#facc15"/>
    <circle cx="-15" cy="15" r="8" fill="#facc15"/>
    <circle cx="15" cy="15" r="8" fill="#facc15"/>
  </g>
</svg>
