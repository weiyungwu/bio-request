<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <!-- Growth and development: tadpole -> frog. No text: meaning is carried by the caption. -->
  <rect width="320" height="240" fill="#0b1b3a"/>
  <g transform="translate(50,140)">
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#a3e635"/>
    <path d="M -20 0 Q -55 10 -70 -8 Q -55 -5 -42 2 Z" fill="#a3e635"/>
    <circle cx="8" cy="-6" r="3" fill="#0b1b3a"/>
  </g>
  <path d="M110 140 L170 140" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#facc15"/>
    </marker>
  </defs>
  <g transform="translate(240,135)">
    <ellipse cx="0" cy="0" rx="26" ry="22" fill="#a3e635"/>
    <circle cx="-10" cy="-10" r="6" fill="#a3e635"/>
    <circle cx="10" cy="-10" r="6" fill="#a3e635"/>
    <circle cx="-10" cy="-10" r="2.5" fill="#0b1b3a"/>
    <circle cx="10" cy="-10" r="2.5" fill="#0b1b3a"/>
    <ellipse cx="-24" cy="18" rx="7" ry="14" fill="#a3e635" transform="rotate(-20 -24 18)"/>
    <ellipse cx="24" cy="18" rx="7" ry="14" fill="#a3e635" transform="rotate(20 24 18)"/>
  </g>
</svg>
